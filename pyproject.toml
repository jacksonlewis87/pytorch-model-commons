[tool.poetry]
name = "pytorch-model-commons"
version = "0.1.10"
description = "Common code for model development, training, and evaluation in pytorch"
authors = ["Jackson Lewis"]
readme = "README.md"
packages = [{include = "pytorch_model_commons"}]

[tool.pytest.ini_options]
testspath = ["tests"]
addopts = "-p no:cacheprovider"

[tool.poetry.dependencies]
python = "^3.10"
pytorch-lightning = "~2.4.0"
torch = "~2.4.0"

matplotlib = "^3.9.0"
[tool.poetry.group.dev.dependencies]
pytest = "~7.3.0"
pre-commit = "^3.7.1"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
